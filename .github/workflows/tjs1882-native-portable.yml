name: TJS-1882 ARM64 preflight diagnosis
on:
  push:
    branches: [tjs1882-native-windows-preflight]
    paths: [.github/workflows/tjs1882-native-portable.yml]
permissions:
  contents: read
concurrency:
  group: tjs1882-remaining-native
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: windows-aarch64
            runner: windows-11-arm
            python_arch: arm64
            timeout: 40
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ci/tjs1882/remaining-native/
            /vanguard/run-portable-ci.py
            /vanguard/ci-inputs.json
            /vanguard/test-portable-refusals.py
            /vanguard/run-portable-mac-check.py
            /vanguard/tester.py
            /vanguard/source-lock.json
            /vanguard/tester-profile.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.16'
          architecture: ${{ matrix.python_arch }}
      - name: Exact remapped archive native Intel journey and ten controls
        if: matrix.target == 'macos-x86_64'
        shell: bash
        run: >-
          python -B vanguard/run-portable-ci.py
          --inputs vanguard/ci-inputs.json
          --inputs-sha256 6edbf5277df9bb21ff507b194faf351240bfadb1650050982626a77f28ed0e8e
          --target macos-x86_64
          --out "$RUNNER_TEMP/tjs1882-native"
      - name: Qualify native ARM64 Python and directory symlink fixture
        if: matrix.target == 'windows-aarch64'
        shell: python
        run: |
          import ctypes, json, os, pathlib, platform, sys
          from ctypes import wintypes
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tjs1882-arm'
          root.mkdir()
          target, link = root / 'fixture-target', root / 'fixture-link'
          proof = {'result': 'FAIL', 'symlink_directory_created': False}
          try:
              assert os.name == 'nt' and platform.python_implementation() == 'CPython'
              assert sys.version_info[:3] == (3, 13, 16) and ctypes.sizeof(ctypes.c_void_p) == 8
              kernel = ctypes.WinDLL('kernel32', use_last_error=True, winmode=0x800)
              current = kernel.GetCurrentProcess
              current.restype, current.argtypes = wintypes.HANDLE, ()
              query = kernel.IsWow64Process2
              query.restype = wintypes.BOOL
              query.argtypes = (wintypes.HANDLE, ctypes.POINTER(wintypes.USHORT), ctypes.POINTER(wintypes.USHORT))
              process, native = wintypes.USHORT(), wintypes.USHORT()
              assert query(current(), ctypes.byref(process), ctypes.byref(native))
              proof.update(process_machine=process.value, native_machine=native.value)
              assert process.value == 0 and native.value == 0xaa64
              target.mkdir()
              os.symlink(target, link, target_is_directory=True)
              assert link.is_symlink() and link.is_dir()
              proof.update(result='PASS_NATIVE_ARM64_SYMLINK_CAPABILITY', symlink_directory_created=True)
          except OSError as error:
              proof['winerror'] = error.winerror
              raise
          finally:
              if link.is_symlink(): link.unlink()
              if target.is_dir(): target.rmdir()
              (root / 'qualification.json').write_text(json.dumps(proof, indent=2))
      - name: Run unchanged independently accepted Windows diagnostic bundle
        if: matrix.target == 'windows-aarch64'
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'tjs1882-arm/bundle.zip'
          Invoke-WebRequest -Uri 'https://meownero.com/downloads/artifacts/meownero-windows-test-diagnostics-v2.zip' -OutFile $bundle -TimeoutSec 120
          if ((Get-Item $bundle).Length -ne 164120029) { throw 'Bundle length mismatch' }
          if ((Get-FileHash $bundle -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'bedd371bc042ec2b893e45693083eae64637ca1a1f496933f2f90a5bf6f38034') { throw 'Bundle hash mismatch' }
          Expand-Archive -LiteralPath $bundle -DestinationPath (Join-Path $env:RUNNER_TEMP 'tjs1882-arm/extract')
          python -B (Join-Path $env:RUNNER_TEMP 'tjs1882-arm/extract/meownero-windows-test/windows-test-bundle.py')
          exit $LASTEXITCODE
      - name: Project fixed preflight failure diagnostics
        if: always() && matrix.target == 'windows-aarch64'
        shell: python
        run: |
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tjs1882-arm'
          rows = []
          for log in root.glob('extract/meownero-windows-test/run-*/output/preflight.log'):
              assert log.is_file() and not log.is_symlink() and log.stat().st_size <= 1024**2
              raw = log.read_bytes()
              text = raw.decode('utf-8', errors='replace')
              row = {'phase': 'PREFLIGHT', 'log_bytes': len(raw), 'log_sha256': hashlib.sha256(raw).hexdigest(), 'reason': 'UNCLASSIFIED'}
              for name in ('monerod', 'monero-wallet-cli', 'monero-wallet-rpc'):
                  if 'program startup failed: ' + name in text: row.update(reason='PROGRAM_STARTUP_FAILED', program=name)
              for phrase, reason in (('package file set mismatch', 'PACKAGE_FILE_SET_MISMATCH'), ('package hash mismatch:', 'PACKAGE_HASH_MISMATCH'), ('wrong architecture', 'WRONG_ARCHITECTURE'), ('wrong binary format or target', 'WRONG_BINARY_TARGET')):
                  if phrase in text: row['reason'] = reason
              for phrase, reason in (('wrong source pin', 'WRONG_SOURCE_PIN'), ('wrong operating system', 'WRONG_OS'), ('Windows requires Python 3.13', 'PYTHON_TOO_OLD'), ('Windows 10 version 1709', 'WINDOWS_TOO_OLD'), ('64-bit Windows programs require', 'PYTHON_WRONG_BITNESS'), ('package symlink refused', 'PACKAGE_SYMLINK_REFUSED'), ('invalid package path', 'INVALID_PACKAGE_PATH'), ('binary is not executable', 'BINARY_NOT_EXECUTABLE'), ('unsafe tester lock owner', 'UNSAFE_LOCK_OWNER'), ('tester busy; no processes started', 'LOCK_BUSY'), ('unsafe tester lock', 'UNSAFE_LOCK'), ('owned Windows journey deadline reached', 'JOB_DEADLINE'), ('owned Windows job cleanup timeout', 'JOB_CLEANUP_TIMEOUT'), ('native module inventory overflow', 'MODULE_INVENTORY_OVERFLOW')):
                  if phrase in text: row['reason'] = reason
              frames = re.findall(r'File "[^"\n]*(tester\.py|portable_windows\.py)", line (\d+), in ([a-zA-Z_][a-zA-Z_0-9]*)', text)
              row['fixed_stack'] = [{'file': name, 'line': int(line), 'function': function} for name, line, function in frames if function in ('<module>', 'preflight', 'require', 'native_architecture', 'check', 'spawn', 'close', 'owned_file', 'safe', 'sha', 'fresh', 'child_environment')]
              errors = re.findall(r'\[WinError (\d+)\]', text)
              if errors: row['winerror'] = int(errors[-1])
              for kind in ('AssertionError', 'OSError', 'PermissionError', 'Refused', 'RuntimeError', 'TimeoutExpired', 'AttributeError', 'TypeError'):
                  if kind + ':' in text: row['exception_type'] = kind
              rows.append(row)
          root.mkdir(exist_ok=True)
          (root / 'preflight-diagnostic.json').write_text(json.dumps({'schema': 'tjs1882-fixed-preflight-diagnostic/1', 'rows': rows}, indent=2))
      - name: Bound public evidence upload
        id: evidence
        if: always()
        shell: python
        run: |
          import os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          files = list(root.glob('tjs1882-native/public/*.json')) + list(root.glob('tjs1882-arm/qualification.json')) + list(root.glob('tjs1882-arm/preflight-diagnostic.json')) + list(root.glob('tjs1882-arm/extract/meownero-windows-test/run-*/report.zip'))
          assert all(p.is_file() and not p.is_symlink() for p in files)
          assert sum(p.stat().st_size for p in files) <= 10 * 1024**2
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream: stream.write('safe=true\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.evidence.outputs.safe == 'true'
        with:
          name: tjs1882-${{ matrix.target }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tjs1882-native/public/*.json
            ${{ runner.temp }}/tjs1882-arm/qualification.json
            ${{ runner.temp }}/tjs1882-arm/preflight-diagnostic.json
            ${{ runner.temp }}/tjs1882-arm/extract/meownero-windows-test/run-*/report.zip
          if-no-files-found: warn
          retention-days: 3
