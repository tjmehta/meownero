name: TJS-1882 native Ubuntu22 baseline build and check
on:
  push:
    branches: [tjs1882-native-windows-preflight]
    paths: [.github/workflows/tjs1882-native-linux.yml]
permissions:
  contents: read
concurrency:
  group: tjs1882-native-linux-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /vanguard/run-portable-linux-ci.py
            /vanguard/run-portable-ci.py
            /vanguard/portable-build.py
            /vanguard/portable-prepare-old-linux.py
            /vanguard/package-portable.py
            /vanguard/portable_licenses.py
            /vanguard/run-portable-check.py
            /vanguard/portable-tester.py
            /vanguard/test-portable-refusals.py
            /vanguard/tester.py
            /vanguard/source-lock.json
            /vanguard/tester-profile.json
            /docs/vanguard-portable-tester.md
            /vanguard/licenses/easyloggingpp-9.96.7/COPYRIGHT-header.txt
            /vanguard/licenses/easyloggingpp-9.96.7/LICENSE
            /vanguard/licenses/easyloggingpp-9.96.7/provenance.json
            /ci/tjs1882/linux-build-inputs.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          architecture: x64
      - name: Locked native old-glibc build and Ubuntu22 journey with ten controls
        shell: bash
        run: >-
          python -B vanguard/run-portable-linux-ci.py
          --inputs ci/tjs1882/linux-build-inputs.json
          --inputs-sha256 d68f8f8779c6a40ba02ea24493bc9ccaee90d0e0e0c0a10a64adc6e8bed84f34
          --out "$RUNNER_TEMP/tjs1882-old-linux"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tjs1882-ubuntu22-x64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tjs1882-old-linux/public/*.json
            ${{ runner.temp }}/tjs1882-old-linux/artifacts/meownero-vanguard-x86_64.tar.gz
            ${{ runner.temp }}/tjs1882-old-linux/artifacts/SHA256SUMS
          if-no-files-found: warn
          retention-days: 3
