# Meownero chain CI (provisional lineage). Remote CI status is not verified here.
# TJ published the private snapshot; subsequent engineering changes stay local until authorized.
name: chain
on:
  push:
    paths: ["chain/**", "spikes/candidate-m/**", "spikes/cuprate/**", "spikes/p2pool/**", "spikes/network-benchmark/**", "spikes/selected-issuance/**", "demos/private-payment/**", ".github/workflows/chain.yml"]
  pull_request:
    paths: ["chain/**", "spikes/candidate-m/**", "spikes/cuprate/**", "spikes/p2pool/**", "spikes/network-benchmark/**", "spikes/selected-issuance/**", "demos/private-payment/**", ".github/workflows/chain.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # SC2317 excluded: shellcheck 0.9.0 (ubuntu-24.04) reports EXIT-trap handler bodies as unreachable.
      - name: shellcheck
        run: sudo apt-get install -y shellcheck && shellcheck -e SC2317 chain/*.sh spikes/candidate-m/devnet.sh spikes/cuprate/run.sh spikes/cuprate/recovery/*.sh spikes/network-benchmark/*.sh spikes/p2pool/*.sh spikes/selected-issuance/*.sh demos/private-payment/*.sh
      - name: patch series is well-formed and pins are consistent
        run: |
          set -e
          test "$(ls chain/patches/*.patch | wc -l)" -eq 15
          grep -q '^UPSTREAM_COMMIT=4f92268d7c16741cfb41e5bbe2aa46cc260a9ea5$' chain/upstream.lock
          python3 -c "import ast,sys; ast.parse(open('spikes/candidate-m/apply.py').read())"

  build-and-test:
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: cache ccache volume
        uses: actions/cache@v4
        with:
          path: ~/.cache/meownero-ccache
          key: meownero-ccache-${{ hashFiles('chain/upstream.lock', 'chain/patches/*.patch', 'chain/Dockerfile') }}
      - name: build (verify pins, apply series, build in container, emission tests, hashes)
        run: MEOW_JOBS=4 chain/build.sh build/chain
      - name: full upstream unit tests (allowed failures documented in docs/security/code-map.md)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/build/chain/monero:/src:ro" -w /tmp meownero-chain-builder bash -ec '
            cp -a /src/tests/data /tmp/test-data
            timeout 600 /src/build/release/tests/unit_tests/unit_tests --data-dir /tmp/test-data \
              --gtest_filter="-ban.subnet:http_server.response_soft_limit:notify.works"
          ' 2>&1 | tail -5
      - name: devnet smoke (3 nodes, 30 blocks, supply = h * 0.9)
        run: spikes/candidate-m/devnet.sh build/chain/monero build/devnet 30
      - name: isolated seed recovery (address, history, exact balance, reopen)
        run: bash chain/test-seed-recovery.sh build/chain/monero build/seed-recovery
      - name: native-DAA reorg and invalid-block checks beyond the sampling window
        run: bash chain/test-reorg.sh build/chain/monero build/reorg mainnet-window
      - name: matched-issuance native-DAA models (not a network performance benchmark)
        run: bash chain/benchmark-difficulty.sh build/chain/monero build/daa-benchmark
      - name: reproducibility (two fresh compilations, fixed image, cache disabled)
        run: |
          MEOW_BUILDER_IMAGE=$(docker image inspect meownero-chain-builder --format '{{.Id}}') \
            MEOW_JOBS=2 bash chain/test-reproducibility.sh build/reproducibility
      - uses: actions/upload-artifact@v4
        with:
          name: meownero-binaries
          path: |
            build/chain/monero/build/release/bin/monerod
            build/chain/monero/build/release/bin/monero-wallet-cli
            build/chain/monero/build/release/bin/monero-wallet-rpc
            build/chain/SHA256SUMS
            build/chain/BUILDER_IMAGE_ID
            build/chain/packages.txt
            build/seed-recovery/result.json
            build/reorg/result.json
            build/daa-benchmark/results.json
            build/daa-benchmark/SOURCE_SHA256SUMS

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: upstream pin is a tag on monero-project/monero
        run: |
          git ls-remote --tags https://github.com/monero-project/monero.git refs/tags/v0.18.5.1^{} | grep -q 4f92268d7c16741cfb41e5bbe2aa46cc260a9ea5
      - name: licenses of vendored pieces are unchanged (BSD-3-Clause family)
        run: git clone -q --depth 1 --branch v0.18.5.1 https://github.com/monero-project/monero.git /tmp/m && grep -q "Redistribution and use in source and binary forms" /tmp/m/LICENSE
