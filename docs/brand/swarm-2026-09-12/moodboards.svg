<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Three original Meownero visual directions for local review</title>
  <desc id="desc">Field notes uses cream paper, forest green and numbered steps. Proof instrument uses pale blue, precise technical annotations and brass. Everyday receipt uses warm white, plum, coral and mint. Linked primary references are at the foot of each column. These are proposals, not a chosen identity.</desc>
  <rect width="1440" height="920" fill="#E5E2DB"/>
  <g font-family="Arial, sans-serif" fill="#252923">
    <text x="44" y="55" font-size="18" letter-spacing="2">MEOWNERO / LOCAL DESIGN STUDY / 12 SEPTEMBER 2026</text>
    <text x="44" y="105" font-size="34">Three ways to make the work legible.</text>
    <text x="44" y="139" font-size="17">Original compositions · linked references · no identity decision</text>
  </g>
  <g transform="translate(40 180)">
    <rect width="440" height="680" fill="#F5F0DF"/>
    <rect width="440" height="56" fill="#163E35"/>
    <text x="24" y="36" font-family="Arial, sans-serif" font-size="20" fill="#F5F0DF">A / FIELD NOTES</text>
    <g stroke="#CEC7B3" fill="none"><path d="M24 90H416M24 502H416M24 580H416"/><path d="M316 90V500" stroke-dasharray="3 6"/></g>
    <g fill="#163E35"><text x="24" y="155" font-family="Georgia, serif" font-size="42">Keep the seed.</text><text x="24" y="206" font-family="Georgia, serif" font-size="42">Recover the</text><text x="24" y="257" font-family="Georgia, serif" font-size="42">payment.</text></g>
    <circle cx="52" cy="333" r="27" fill="#BA432B"/><text x="44" y="341" font-family="Arial, sans-serif" font-size="23" fill="#FFF">1</text>
    <circle cx="52" cy="401" r="27" fill="#163E35"/><text x="44" y="409" font-family="Arial, sans-serif" font-size="23" fill="#FFF">2</text>
    <g font-family="Arial, sans-serif" fill="#163E35" font-size="20"><text x="96" y="340">Read the steps.</text><text x="96" y="408">Check the result.</text><text x="24" y="472" font-size="16">Paper / hierarchy / quiet confidence</text></g>
    <rect x="24" y="528" width="105" height="28" fill="#163E35"/><rect x="137" y="528" width="105" height="28" fill="#BA432B"/><rect x="250" y="528" width="105" height="28" fill="#CEC7B3"/>
    <g font-family="Arial, sans-serif" font-size="16" fill="#163E35"><text x="24" y="612">Reference: NPS Unigrid oral history</text><text x="24" y="644">For: the recovery guide</text></g>
    <a href="https://home.nps.gov/subjects/oralhistory/podcasts-episode-4.htm"><rect x="20" y="590" width="390" height="34" fill="transparent"/></a>
  </g>
  <g transform="translate(500 180)">
    <rect width="440" height="680" fill="#E8EFF7"/>
    <g stroke="#BCCBDC" stroke-width="1"><path d="M24 82H416M24 502H416M24 580H416M24 102V475M416 102V475"/></g>
    <g font-family="monospace" fill="#17375E"><text x="24" y="38" font-size="20">B / PROOF INSTRUMENT</text><text x="24" y="125" font-size="16">OBSERVATION 001</text><text x="24" y="160" font-size="28">One kernel.</text><text x="24" y="196" font-size="28">Exact answers.</text></g>
    <g fill="none" stroke="#17375E" stroke-width="2"><circle cx="220" cy="330" r="83"/><circle cx="220" cy="330" r="61"/><path d="M105 330H335M220 218V442M165 267L285 391"/><path d="M42 244H140M300 416H398"/></g>
    <circle cx="220" cy="330" r="9" fill="#8C5B22"/>
    <g font-family="monospace" fill="#17375E" font-size="14"><text x="43" y="235">INPUT</text><text x="303" y="440">DIGEST</text><text x="24" y="475">Schematic only / not a security proof</text></g>
    <rect x="24" y="528" width="105" height="28" fill="#17375E"/><rect x="137" y="528" width="105" height="28" fill="#8C5B22"/><rect x="250" y="528" width="105" height="28" fill="#BCCBDC"/>
    <g font-family="Arial, sans-serif" font-size="16" fill="#17375E"><text x="24" y="612">Reference: NASA Golden Record cover</text><text x="24" y="644">For: the optimization challenge</text></g>
    <a href="https://science.nasa.gov/mission/voyager/golden-record-cover/"><rect x="20" y="590" width="400" height="34" fill="transparent"/></a>
  </g>
  <g transform="translate(960 180)">
    <rect width="440" height="680" fill="#FFF9F1"/>
    <text x="24" y="38" font-family="Arial, sans-serif" font-size="20" fill="#432F46">C / EVERYDAY RECEIPT</text>
    <circle cx="354" cy="127" r="39" fill="#D6664D"/>
    <text x="24" y="148" font-family="Arial, sans-serif" font-size="39" fill="#432F46">It arrived.</text>
    <path d="M42 210H396V447L378 459L360 447L342 459L324 447L306 459L288 447L270 459L252 447L234 459L216 447L198 459L180 447L162 459L144 447L126 459L108 447L90 459L72 447L54 459L42 447Z" fill="#B9D9C7"/>
    <g fill="#432F46"><text x="63" y="251" font-family="Arial, sans-serif" font-size="17">RECEIVED / DISPOSABLE TEST</text><text x="63" y="305" font-family="monospace" font-size="29">0.123456789012</text><path d="M63 328H376" stroke="#432F46"/><text x="63" y="365" font-family="Arial, sans-serif" font-size="22">Same amount after restore.</text><text x="63" y="404" font-family="Arial, sans-serif" font-size="16">Local prototype. Check the evidence.</text></g>
    <path d="M24 502H416M24 580H416" stroke="#D9CCC9"/>
    <rect x="24" y="528" width="105" height="28" fill="#432F46"/><rect x="137" y="528" width="105" height="28" fill="#D6664D"/><rect x="250" y="528" width="105" height="28" fill="#B9D9C7"/>
    <g font-family="Arial, sans-serif" font-size="16" fill="#432F46"><text x="24" y="612">Reference: Monero press-kit geometry</text><text x="24" y="644">For: the payment explainer</text></g>
    <a href="https://www.getmonero.org/press-kit/"><rect x="20" y="590" width="390" height="34" fill="transparent"/></a>
  </g>
  <text x="44" y="897" font-family="Arial, sans-serif" font-size="16" fill="#252923">No alley-cat imagery, lore, investment promise or claim of network anonymity. Read README.md for references and limits.</text>
</svg>
